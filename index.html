<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>LEGO Pixel Art Generator</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/lego_parts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
  <h1>LEGO Pixel Art Generator</h1>
  <p>Carica la tua immagine e genera il PDF con tutti i pezzi 1×1 LEGO.</p>

  <input type="file" id="imageUpload" accept="image/*">

  <section id="preview-section" class="hidden">
    <h2>Anteprima</h2>
    <canvas id="previewCanvas"></canvas>
  </section>

  <section id="size-section" class="hidden">
    <h2>Scegli dimensione pixel art</h2>
    <div id="suggestedSizes"></div> <!-- pulsanti generati dinamicamente -->
    <p>Oppure inserisci dimensione personalizzata:</p>
    <input type="number" id="widthInput" placeholder="Width in studs">
    <input type="number" id="heightInput" placeholder="Height in studs">
    <button id="applySize">Applica</button>
  </section>

  <section id="pdf-section" class="hidden">
    <button id="generatePDF">Genera PDF</button>
  </section>
</div>

<script src="js/script.js"></script>
</body>
</html>
