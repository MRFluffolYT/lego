<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto → LEGO Pixel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Foto → LEGO Pixel</h1>

  <div id="controls">
    <input type="file" id="imageUpload">
    <label>Dettaglio (numero mattoncini per lato):
      <input type="range" id="detailSlider" min="8" max="64" value="16">
      <span id="detailValue">16</span>
    </label>
    <button id="generatePDF">Genera PDF</button>
  </div>

  <canvas id="canvas"></canvas>

  <div id="summary"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
