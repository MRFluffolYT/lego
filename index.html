<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>LEGO Mosaic Generator Professionale</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
<h1>LEGO Mosaic Generator</h1>
<p>Trasforma le tue foto in mosaici LEGO professionali</p>


<section id="upload-section">
<input type="file" id="imageUpload" accept="image/*">
</section>


<section id="options-section" class="hidden">
<h2>Scegli la dimensione</h2>
<div id="optionsContainer"></div>
</section>


<section id="preview-section" class="hidden">
<h2>Anteprima</h2>
<canvas id="previewCanvas"></canvas>
</section>


<section id="details-section" class="hidden">
<h2>Dettagli progetto</h2>
<div id="details">
<ul id="pieces"></ul>
<button id="generatePDF">Genera PDF con numeri</button>
</div>
</section>
</div>
<script src="js/script.js"></script>
</body>
</html>
