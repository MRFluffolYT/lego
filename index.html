<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel LEGO Editor Avanzato</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pixel LEGO Editor Avanzato</h1>

  <div id="toolbar">
    <span>Seleziona colore:</span>
  </div>

  <div id="layerControls">
    <button id="prevLayer">⬆ Layer precedente</button>
    <span id="currentLayer">Layer 1</span>
    <button id="nextLayer">Layer successivo</button>
    <button id="addLayer">➕ Aggiungi Layer</button>
  </div>

  <div id="sizeControls">
    <label>Tipo mattoncino:
      <select id="brickSize">
        <option value="1">1x1</option>
        <option value="2">1x2</option>
        <option value="3">2x2</option>
      </select>
    </label>
  </div>

  <div id="container"></div>

  <div id="buttons">
    <button id="generatePDF">Genera PDF</button>
    <button id="saveProject">Salva progetto</button>
    <button id="loadProject">Carica progetto</button>
    <input type="file" id="fileInput" style="display:none">
  </div>

  <div id="summary"></div>

  <!-- Librerie CDN -->
  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
